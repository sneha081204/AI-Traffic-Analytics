version: '3.8'

services:
  # Backend API & AI Vision Service
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: traffic_ai_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-traffic-ai-secret-enterprise-key-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DB_ENGINE=${DB_ENGINE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///backend/storage/database.sqlite}
      - AI_DEVICE=cpu
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/.env:/app/backend/.env
      - ./ai_engine/weights:/app/ai_engine/weights
      - ./data:/app/data
    networks:
      - traffic_net

  # Decoupled Nginx Web Client (Frontend)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: traffic_ai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge

