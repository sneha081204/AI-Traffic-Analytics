[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-ai-backend"
version = "2.4.0"
description = "AI Traffic Analytics for Helmet and Seatbelt Violation Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-Cors>=4.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.0.20",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.8.0",
    "easyocr>=1.7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
